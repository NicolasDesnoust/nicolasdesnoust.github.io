components:
  schemas:
    SendContactMailRequest:
      type: object
      required:
        - subject
        - body
        - sender
        - turnstileToken
      properties:
        subject:
          type: string
          maxLength: 200
        body:
          type: string
          maxLength: 5000
        sender:
          $ref: "#/components/schemas/SendContactMailRequest.Sender"
        turnstileToken:
          type: string
          description: Cloudflare Turnstile token, verified server-side before sending.
          maxLength: 2048

    SendContactMailRequest.Sender:
      type: object
      required:
        - name
        - emailAddress
      properties:
        name:
          type: string
          maxLength: 200
        emailAddress:
          type: string
          maxLength: 320
